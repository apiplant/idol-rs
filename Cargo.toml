[package]
name = "idol-rs"
version = "0.1.0"
edition = "2021"
# ntex 4 (the `serve` feature) needs 1.97
rust-version = "1.97"
description = "Idol: a single image to a 3D Gaussian splat, in Rust (candle on CUDA or Metal)"
license = "Apache-2.0"
repository = "https://github.com/apiplant/idol-rs"
homepage = "https://idol-rs.apiplant.com"
readme = "README.md"
keywords = ["3d", "gaussian-splatting", "image-to-3d", "diffusion", "candle"]
categories = ["multimedia::images", "science", "command-line-utilities"]
# the crate is the engine and the binary; model weights are never part of it
include = ["/src/", "/kernels/", "/build.rs", "/README.md", "/LICENSE", "/ui/dist/"]

[lib]
name = "idol_rs"

[[bin]]
name = "idol"
path = "src/main.rs"
required-features = ["serve"]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-flash-attn = { version = "0.11.0", optional = true }
clap = { version = "4", features = ["derive", "env"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ntex = { version = "4", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
ureq = "2"

[features]
default = ["cuda", "flash-attn", "serve"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# Apple Silicon GPU through Candle's Metal backend.
metal = ["candle-core/metal", "candle-nn/metal"]
# `idol serve` / `idol_rs::serve` (ntex HTTP server)
serve = ["dep:ntex", "dep:tokio"]
flash-attn = ["cuda", "dep:candle-flash-attn"]

[profile.release]
opt-level = 3
debug = false
codegen-units = 16

# release archives and packages: no debug info
[profile.dist]
inherits = "release"
strip = true

[profile.dev]
opt-level = 1
